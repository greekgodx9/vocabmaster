<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster Icon Generator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    h1 { color: #6366f1; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 24px; }
    .preview { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
    .preview-item { text-align: center; }
    .preview-item canvas { border-radius: 20%; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
    .preview-item span { display: block; font-size: 12px; color: #94a3b8; margin-top: 8px; }
    button {
      background: #6366f1; color: #fff; border: none;
      padding: 14px 36px; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; margin: 8px;
      transition: background .2s;
    }
    button:hover { background: #5558e6; }
    .status { margin-top: 16px; padding: 10px 20px; border-radius: 8px; font-size: 14px; }
    .status.ok { background: #065f46; color: #6ee7b7; }
    .status.info { background: #1e3a5f; color: #93c5fd; }
  </style>
</head>
<body>
  <h1>🎨 VocabMaster Icon Generator</h1>
  <p>Open this page, then click "Generate & Download All".<br>Save the downloaded PNGs into the <code>icons/</code> folder.</p>

  <div class="preview">
    <div class="preview-item">
      <canvas id="c180" width="180" height="180"></canvas>
      <span>icon-180.png (iOS)</span>
    </div>
    <div class="preview-item">
      <canvas id="c192" width="192" height="192"></canvas>
      <span>icon-192.png</span>
    </div>
    <div class="preview-item">
      <canvas id="c512" width="512" height="512"></canvas>
      <span>icon-512.png</span>
    </div>
  </div>

  <button onclick="generateAll()">⬇ Generate & Download All</button>
  <div id="status"></div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const s = size;

      // Background gradient
      const bg = ctx.createLinearGradient(0, 0, s, s);
      bg.addColorStop(0, '#6366f1');
      bg.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, s * 0.225);
      ctx.fill();

      // Book emoji simulation — simple geometric book shape
      const cx = s / 2, cy = s / 2;
      const bw = s * 0.38, bh = s * 0.44;
      const spine = s * 0.06;

      // Book spine / left cover
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.roundRect(cx - bw / 2, cy - bh / 2, bw, bh, s * 0.04);
      ctx.fill();

      // Pages (white)
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(cx - bw / 2 + spine, cy - bh / 2 + s * 0.02, bw - spine * 2, bh - s * 0.04, s * 0.02);
      ctx.fill();

      // Page lines
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = Math.max(1, s * 0.008);
      const lineY = cy - bh * 0.2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - bw * 0.22, lineY + i * s * 0.09);
        ctx.lineTo(cx + bw * 0.22, lineY + i * s * 0.09);
        ctx.stroke();
      }

      // "V" letter on cover
      ctx.fillStyle = '#6366f1';
      ctx.font = `bold ${s * 0.16}px system-ui`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('V', cx + spine * 0.2, cy - bh * 0.05);

      // "M" letter
      ctx.fillText('M', cx + spine * 0.2, cy + bh * 0.18);

      // Subtle shine
      const shine = ctx.createLinearGradient(0, 0, s, s);
      shine.addColorStop(0, 'rgba(255,255,255,0.18)');
      shine.addColorStop(0.5, 'rgba(255,255,255,0)');
      shine.addColorStop(1, 'rgba(255,255,255,0.08)');
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, s * 0.225);
      ctx.fill();
    }

    function generateAll() {
      const status = document.getElementById('status');
      status.className = 'status info';
      status.textContent = 'Generating icons...';

      const sizes = [
        { id: 'c180', name: 'icon-180.png', size: 180 },
        { id: 'c192', name: 'icon-192.png', size: 192 },
        { id: 'c512', name: 'icon-512.png', size: 512 },
      ];

      sizes.forEach(({ id, name, size }) => {
        drawIcon(document.getElementById(id), size);
      });

      // Small delay for canvas to render
      setTimeout(() => {
        sizes.forEach(({ id, name }) => {
          const canvas = document.getElementById(id);
          canvas.toBlob((blob) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
          }, 'image/png');
        });

        status.className = 'status ok';
        status.textContent = '✅ All icons downloaded! Move them into the icons/ folder of your VocabMaster project.';
      }, 200);
    }

    // Draw previews on load
    window.addEventListener('DOMContentLoaded', () => {
      drawIcon(document.getElementById('c180'), 180);
      drawIcon(document.getElementById('c192'), 192);
      drawIcon(document.getElementById('c512'), 512);
    });
  </script>
</body>
</html>
