<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Book -->
  <rect x="130" y="118" width="252" height="276" rx="22" fill="#1e1b4b"/>
  <!-- Pages -->
  <rect x="168" y="138" width="176" height="236" rx="10" fill="#f8fafc"/>
  <!-- Text lines -->
  <line x1="195" y1="212" x2="317" y2="212" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="195" y1="252" x2="317" y2="252" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="195" y1="292" x2="280" y2="292" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <!-- V and M letters on pages -->
  <text x="256" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="bold" font-size="54" fill="#6366f1">V</text>
  <text x="256" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="bold" font-size="54" fill="#6366f1">M</text>
  <!-- Shine -->
  <rect width="512" height="512" rx="115" fill="white" opacity="0.08"/>
  <path d="M0 0 L256 0 L0 256 Z" fill="white" opacity="0.1"/>
</svg>
